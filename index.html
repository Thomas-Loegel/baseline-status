<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;baseline-status&gt; — playground</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font: 16px/1.6 system-ui, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 3rem 1.5rem 6rem;
        color-scheme: light dark;
        color: light-dark(#111, #eee);
        background: light-dark(#fafafa, #111);
      }

      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: .25rem;
      }
      h1 { font-size: 1.25rem; margin: 0; }
      .subtitle { font-size: .9rem; margin: 0 0 3rem; }

      section { margin-bottom: 3rem; }
      h2 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        margin: 0 0 .75rem;
      }

      a,
      a:visited,
      a:hover,
      a:active{
        color: light-dark(#1a73e8, #fff);
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        font-weight: 700;
      }

      .examples { display: grid; gap: .75rem; }

      baseline-status { display: block; }

      /* Live tester */
      .tester { margin-top: 3rem; }
      label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .4rem; }
      input {
        width: 100%;
        padding: .5rem .75rem;
        font: inherit;
        border: 1px solid light-dark(#ccc, #444);
        border-radius: 8px;
        background: light-dark(#fff, #1e1e1e);
        color: inherit;
      }
      input:focus { outline: 2px solid #1a73e8; outline-offset: 1px; border-color: transparent; }
      .hint { font-size: .85rem; margin-top: .4rem; }

      .lang-switcher { display: flex; gap: .5rem; }
      .lang-switcher button {
        padding: .3rem .8rem;
        font: inherit;
        font-size: .8rem;
        font-weight: 600;
        border: 1px solid light-dark(#ccc, #444);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .lang-switcher button[aria-pressed="true"] {
        background: #1a73e8;
        border-color: #1a73e8;
        color: #fff;
      }
    </style>
  </head>
  <body>

    <div class="header">
      <h1>&lt;baseline-status&gt;</h1>
      <div class="lang-switcher" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">en</button>
        <button data-lang="fr" aria-pressed="false">fr</button>
      </div>
    </div>
    <p class="subtitle" data-i18n="subtitle">Zero-dependency web component — all status states demo</p>

    <section class="tester">
      <h2>Live tester</h2>
      <label for="featureInput">Feature ID</label>
      <input id="featureInput" value="has" placeholder="e.g. css-nesting, subgrid, has…" />
      <p class="hint">
        <span data-i18n="hint">Type any feature ID from</span> <a href="https://webstatus.dev" target="_blank"
          rel="noopener">webstatus.dev</a>
      </p>
      <baseline-status id="live" featureId="has"></baseline-status>
    </section>

    <section>
      <h2 data-i18n="allStates">All states</h2>
      <div class="examples">
        <baseline-status featureId="grid"></baseline-status>
        <baseline-status featureId="view-transitions"></baseline-status>
        <baseline-status featureId="text-justify"></baseline-status>
        <baseline-status featureId="__nonexistent-feature__"></baseline-status>
      </div>
    </section>

    <section>
      <h2>Custom icon sizes</h2>
      <div class="examples">
        <baseline-status featureId="grid"></baseline-status>
        <baseline-status featureId="grid" style="--bs-status-icon-size:32px;--bs-browser-icon-size:32px"></baseline-status>
        <baseline-status featureId="grid" style="--bs-status-icon-size:48px;--bs-browser-icon-size:48px"></baseline-status>
      </div>
    </section>

    <script type="module">
      import { registerTranslations } from '/src/index.ts';

      // Only "en" is built-in; all other languages must be registered this way.
      registerTranslations('fr', {
        status: {
          limited: { title: 'Disponibilité limitée',   desc: "Cette fonctionnalité n'est pas Baseline car elle ne fonctionne pas dans certains navigateurs courants." },
          newly:   { title: 'Nouvellement disponible', desc: 'Depuis que cette fonctionnalité est devenue Baseline, elle fonctionne sur les derniers appareils et navigateurs.' },
          widely:  { title: 'Largement disponible',    desc: 'Cette fonctionnalité est bien établie et fonctionne sur de nombreux appareils et navigateurs.' },
          loading: { title: 'Chargement…',             desc: '' },
          error:   { title: 'Échec du chargement',     desc: 'Impossible de récupérer les données de la fonctionnalité.' },
          unknown: { title: 'Disponibilité inconnue',  desc: 'Aucune donnée de support navigateur disponible.' },
        },
        newlyChip:      'Nouvellement disponible',
        browsersLabel:  'Support navigateurs',
        browserSupport: { available: 'supporté', unavailable: 'non supporté', unknown: 'inconnu' },
        versionSince:   'depuis v',
        link:           'Voir sur webstatus.dev',
        newTab:         '(nouvel onglet)',
      });

      const input = document.getElementById('featureInput');
      const live  = document.getElementById('live');

      let timer;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const id = input.value.trim();
          if (id) live.featureId = id;
        }, 300);
      });

      const pageStrings = {
        en: { subtitle: 'Zero-dependency web component — all status states demo', hint: 'Type any feature ID from', allStates: 'All states' },
        fr: { subtitle: 'Web component sans dépendance — démo de tous les états', hint: 'Saisissez un identifiant de fonctionnalité depuis', allStates: 'Tous les états' },
      };

      document.querySelectorAll('.lang-switcher button').forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang;
          document.querySelectorAll('baseline-status').forEach(el => el.lang = lang);
          document.querySelectorAll('.lang-switcher button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
          document.documentElement.lang = lang;
          const s = pageStrings[lang] ?? pageStrings.en;
          document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = s[el.dataset.i18n]);
        });
      });
    </script>

  </body>
</html>
